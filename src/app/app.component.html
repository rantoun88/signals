<h1>Signals in Angular</h1>
<div class="search-wrapper" *ngIf="tabIndex !== 0">
  <input
    type="text"
    [value]="search()"
    (input)="updateSearchTerm($any($event.target).value)"
    placeholder="🔍 Search products..."
  />
</div>

<!-- Material Tabs -->
<mat-tab-group [(selectedIndex)]="tabIndex" (selectedIndexChange)="onTabChange($event)">
  <mat-tab label="Counter"></mat-tab>
  <mat-tab label="Dashboard 1"><product-dashboard-signals1 [searchTerm]="search()"></product-dashboard-signals1></mat-tab>
  <mat-tab label="Dashboard 2"><product-dashboard-signals2 [searchTerm]="search()"></product-dashboard-signals2></mat-tab>
</mat-tab-group>
