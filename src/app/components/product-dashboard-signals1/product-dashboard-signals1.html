<h2 class="dashboard-title">Product Dashboard</h2>

<!-- Category Filter -->
<div class="category-filter">
  <button (click)="selectCategory(null)">All</button>
  <button (click)="selectCategory('Laptops')">Laptops</button>
  <button (click)="selectCategory('Tablets')">Tablets</button>
  <button (click)="selectCategory('Phones')">Phones</button>
</div>

<!-- Product List -->
<ul class="product-list">
  <li *ngFor="let product of filteredProducts()" class="product-item" (click)="onProductClick(product)" [ngClass]="{'highlight-violet': selected() === product.id}">


    {{ product.name }} <span class="category-label">({{ product.category }})</span>
    <mat-icon (click)="selectedChange.emit(product.id)">shopping_cart</mat-icon>
  </li>
</ul>

<div>
  <p>Selected count is {{ selectedCount() }}</p>
</div>
<div>
  <p>Selected category is {{ selectedCategory() || 'ALL' }}</p>
</div>
